<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/webp" href="https://tools.chat-alkhaleej.com/logo.webp">
    <title>لوحة تحكم مدونة شات الخليج</title>
    <style>
        body {
            margin: 0;
            font-family: 'Cairo', system-ui, -apple-system, sans-serif;
            background: #f8fafc;
        }
        /* شاشة التحميل قبل تحميل CMS */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #450C0C 0%, #631212 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            color: #ffd86b;
        }
        .loading-screen img {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
        }
        .loading-screen h1 {
            font-size: 22px;
            margin: 0 0 8px;
            font-weight: 900;
        }
        .loading-screen p {
            font-size: 14px;
            opacity: 0.9;
            margin: 0 0 25px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 216, 107, 0.2);
            border-top-color: #ffd86b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        body.cms-loaded .loading-screen {
            display: none;
        }
    </style>
</head>
<body>

<!-- شاشة التحميل -->
<div class="loading-screen" id="loadingScreen">
    <img src="https://tools.chat-alkhaleej.com/logo.webp" alt="شات الخليج" />
    <h1>لوحة تحكم مدونة شات الخليج</h1>
    <p>جاري تحميل نظام إدارة المحتوى...</p>
    <div class="spinner"></div>
</div>

<!-- Sveltia CMS -->
<script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

<script>
    // إخفاء شاشة التحميل بعد ظهور CMS
    window.addEventListener('load', () => {
        setTimeout(() => {
            document.body.classList.add('cms-loaded');
        }, 1500);
    });
</script>

</body>
</html>
