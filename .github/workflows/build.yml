# 🤖 بناء المدونة + Landing Pages تلقائياً
#
# يشتغل عند:
# - أي تغيير في المقالات (posts/)
# - أي تغيير في Landing Pages (_landing-data/)
# - أي تغيير في القوالب (_templates/)
# - أي تعديل على السكربت أو الـ workflow

name: 🚀 بناء المدونة

on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - '_landing-data/**'
      - '_templates/**'
      - 'scripts/build.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 تحميل الكود
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 تثبيت Dependencies (js-yaml)
        run: npm install --omit=dev

      - name: 🏗️ بناء المدونة وLanding Pages
        run: node scripts/build.js

      - name: 💾 حفظ التحديثات
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # إضافة كل الملفات الجديدة والمعدّلة (بما فيها مجلدات Landing Pages)
          # لا نضيف node_modules (موجود في .gitignore)
          git add -A

          if git diff --staged --quiet; then
            echo "✅ لا توجد تغييرات للحفظ"
          else
            echo "📋 الملفات المتغيرة:"
            git diff --staged --name-only

            git commit -m "🤖 تحديث تلقائي: بناء المدونة وصفحات الهبوط [skip ci]"
            git push
            echo "✅ تم حفظ التحديثات بنجاح"
          fi

      - name: 📡 إخبار IndexNow بالتحديثات
        continue-on-error: true
        run: |
          INDEXNOW_KEY="alkhaleej-blog-key-2026"

          echo "📨 إرسال تحديثات لـ IndexNow..."

          URLS_JSON=$(grep -oP '(?<=<loc>)[^<]+' sitemap.xml | head -50 | jq -R . | jq -s . 2>/dev/null || echo '["https://blog.chat-alkhaleej.com/"]')

          curl -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{
              \"host\": \"blog.chat-alkhaleej.com\",
              \"key\": \"$INDEXNOW_KEY\",
              \"keyLocation\": \"https://blog.chat-alkhaleej.com/$INDEXNOW_KEY.txt\",
              \"urlList\": $URLS_JSON
            }" || echo "⚠️ فشل إخبار IndexNow (غير مهم)"

          echo ""
          echo "✅ اكتمل الإشعار"
